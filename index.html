<style>
/* Layout: mobile-first single column that becomes a 2-3 column card grid on wide screens; sticky top bar, six-tab bottom bar. Palette and logo come from the Tumux desktop app. */
:root{color-scheme:dark;--bg1:#0b0820;--bg2:#241050;--glow:rgba(139,92,246,.28);--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.13);--fg:#f3f0ff;--sub:#a79fc9;--track:rgba(255,255,255,.12);--solid:#1a1438;--field:#261e4d;--good:#34d399;--bad:#f87171;--acc:#8b5cf6;--acc2:#a78bfa;--acc3:#6d28d9;--amber:#f59e0b;--pink:#ec4899;--blue:#3b82f6;--bar:rgba(11,8,32,.92);--font:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){color-scheme:light;--bg1:#f6f3ff;--bg2:#e6deff;--glow:rgba(139,92,246,0);--card:rgba(255,255,255,.88);--line:rgba(139,92,246,.22);--fg:#1e1b3a;--sub:#6b6590;--track:rgba(139,92,246,.15);--solid:#fff;--field:#f1ecff;--good:#059669;--bad:#dc2626;--bar:rgba(246,243,255,.94)}}
:root[data-theme="light"]{color-scheme:light;--bg1:#f6f3ff;--bg2:#e6deff;--glow:rgba(139,92,246,0);--card:rgba(255,255,255,.88);--line:rgba(139,92,246,.22);--fg:#1e1b3a;--sub:#6b6590;--track:rgba(139,92,246,.15);--solid:#fff;--field:#f1ecff;--good:#059669;--bad:#dc2626;--bar:rgba(246,243,255,.94)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background-color:var(--bg1);background-image:radial-gradient(circle at 85% 6%,var(--glow),transparent 55%),linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed;color:var(--fg);font:15px/1.45 var(--font);min-height:100vh;
 padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 104px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg1)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
h1,h2,h3,p{margin:0}
.num{font-variant-numeric:tabular-nums}
.sub{color:var(--sub)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg1);display:flex;align-items:center;gap:10px;padding:10px 0;max-width:1100px;margin:0 auto}
.top .t{flex:1;min-width:0;font-weight:700;font-size:17px}
.ib{width:42px;height:42px;border-radius:13px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;flex:none}
.ib svg{width:20px;height:20px;stroke:var(--fg);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
main{max-width:1100px;margin:0 auto;padding-top:6px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr))}
.wide{grid-column:1/-1}

.card h2{font-size:15px;font-weight:700}
.hd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.hero{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin:6px 0 4px}
.hero .g{font-size:24px;font-weight:700;line-height:1.15}
.hero .n{font-size:clamp(28px,10vw,40px);font-weight:800;line-height:1.1;color:var(--acc2);background:none;border:0;padding:0;margin:0;text-align:left;display:block;max-width:100%;overflow-wrap:anywhere;font-family:inherit;cursor:pointer}
.hero .n small{display:block;font-size:11px;font-weight:500;color:var(--sub);margin-top:3px}
:root[data-theme="light"] .hero .n{color:var(--acc)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .hero .n{color:var(--acc)}}
.hero .tag{color:var(--sub);font-size:13px;margin-top:2px}
.clk{text-align:right;flex:none}

.btns{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 16px}
.pill{border:0;border-radius:999px;padding:10px 18px;font-weight:700;font-size:14px;color:#fff;background:linear-gradient(135deg,var(--acc),var(--acc3));min-height:42px}

.pill.s{padding:6px 13px;font-size:12.5px;min-height:34px}
.pill.d{background:none;color:var(--bad);border:1.5px solid var(--bad)}
.big{font-size:30px;font-weight:800;overflow-wrap:anywhere}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}

.stats b{font-size:14.5px;overflow-wrap:anywhere}
.good{color:var(--good)}.bad{color:var(--bad)}.amb{color:var(--amber)}.acc{color:var(--acc2)}

.cal button{border:0;background:none;border-radius:12px;aspect-ratio:1/0.92;min-height:36px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px}
.cal button.o{color:var(--sub);opacity:.55}
.cal button.t{box-shadow:inset 0 0 0 1.5px var(--acc2)}
.cal button.sel{background:linear-gradient(135deg,var(--acc2),var(--acc3));color:#fff;opacity:1}
.cal .dots{display:flex;gap:2px;height:5px}
.cal .dots i{width:4px;height:4px;border-radius:50%;background:var(--acc2)}
.cal .dots i.e{background:var(--pink)}
.cal button.sel .dots i{background:#fff}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .m{flex:1;min-width:0}
.li .m b{display:block;font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .m small{color:var(--sub);font-size:12px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.x{border:0;background:none;color:var(--sub);font-size:20px;line-height:1;padding:6px 8px;border-radius:8px}
.empty{color:var(--sub);font-size:13.5px;padding:6px 0}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:14px;background:var(--track);margin-bottom:14px}
.seg button{border:0;background:none;border-radius:10px;padding:10px;font-weight:700;color:var(--sub)}
.seg button[aria-pressed="true"]{background:linear-gradient(135deg,var(--acc),var(--acc3));color:#fff}
label{display:block;font-size:12.5px;color:var(--sub);margin:0 0 4px}
input,select{width:100%;min-height:46px;border-radius:13px;border:1px solid var(--line);background:var(--field);padding:10px 12px;color:var(--fg)}
input[type=checkbox]{width:22px;min-height:22px;height:22px}
.f{margin-bottom:12px}
.err{color:var(--bad);font-size:13px;min-height:18px;margin:-4px 0 8px}
.chk{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.chk label{margin:0;color:var(--fg);font-size:14px}
.scrim{position:fixed;inset:0;background:rgba(5,3,16,.6);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:90vh;overflow:auto;background:var(--solid);border:1px solid var(--line);border-radius:26px 26px 0 0;
 padding:18px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));max-width:560px;margin:0 auto}
.sheet h2{font-size:19px;margin-bottom:14px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--bar);border-top:1px solid var(--line);backdrop-filter:blur(12px);display:grid;grid-template-columns:repeat(6,1fr);
 padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:10.5px;color:var(--sub);min-height:50px;border-radius:14px}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current="page"]{color:#fff;background:linear-gradient(135deg,var(--acc2),var(--acc3))}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg1);padding:10px 16px;border-radius:14px;z-index:60;font-size:14px;max-width:90%;text-align:center}
.chips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:6px}
.ring{display:block;margin:0 auto;max-width:230px;width:100%}
.legend{display:flex;flex-direction:column;gap:5px;margin-top:8px;font-size:13px}
.legend div{display:flex;align-items:center;gap:8px}
.legend b{margin-left:auto;font-variant-numeric:tabular-nums}
.hab{display:grid;grid-template-columns:minmax(78px,1.6fr) repeat(7,1fr) 38px;align-items:center;gap:2px;min-width:0}
.hab .hh{font-size:11px;color:var(--sub);text-align:center;padding-bottom:4px}
.hab .hh.td{color:var(--acc2);font-weight:700}
.hab .nm{display:flex;align-items:center;gap:7px;min-width:0;font-size:13.5px}
.hab .nm span.tile{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px;flex:none}
.hab .nm span.tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hab .c{border:0;background:none;display:grid;place-items:center;padding:5px 0;min-height:38px}
.hab .c i{width:24px;height:24px;border-radius:50%;border:1.6px solid var(--sub);opacity:.6;display:grid;place-items:center;color:#fff;font-style:normal;font-size:13px;font-weight:700}
.hab .c.on i{border:0;opacity:1}
.hab .c.fu i{opacity:.25}
.hab .st{text-align:right;font-weight:700;font-size:13px}
.lockscr{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;background-color:var(--bg1);background-image:radial-gradient(circle at 85% 8%,var(--glow),transparent 55%),linear-gradient(160deg,var(--bg1),var(--bg2));padding:20px}
.pdots{display:flex;gap:14px;margin:4px 0 6px}
.pdots i{width:15px;height:15px;border-radius:50%;border:2px solid var(--acc2)}
.pdots i.on{background:var(--acc2)}
.keys{display:grid;grid-template-columns:repeat(3,76px);gap:12px}
.keys button{height:62px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:22px;font-weight:600}
.keys button:disabled{opacity:.4}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .18s ease-out}@keyframes up{from{opacity:0;transform:translate(-50%,8px)}}}
</style>
</head>
<body>
<div class="top">

  <button class="ib" id="themeBtn" aria-label="Switch theme"><svg viewBox="0 0 24 24" id="themeIcon"></svg></button>
</div>
<main id="app"></main>
<div id="sheetHost"></div><div id="toastHost"></div><div id="lockHost"></div>

  <button data-go="calendar"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Calendar</button>
  <button data-go="money"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg>Money</button>
  <button data-go="budget"><svg viewBox="0 0 24 24"><circle cx="11" cy="13" r="8"/><path d="M13 3a8 8 0 0 1 8 8h-8z"/></svg>Budget</button>

  <button data-go="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>Settings</button>
</nav>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<script>
(function(){
"use strict";
var KEY="tumux.v2",PAL=["#8b5cf6","#ec4899","#3b82f6","#f59e0b","#10b981","#06b6d4","#f97316","#94a3b8"];
var EXPC=["Food","Transport","Airtime & data","Rent","Bills","Health","School","Shopping","Entertainment","Other"];
var INCC=["Salary","Business","Allowance","Gift","Other"];
var KINDS=["Birthday","Anniversary","Meeting","Bill due","Other"],KCOL={"Birthday":"#ec4899","Anniversary":"#f59e0b","Meeting":"#3b82f6","Bill due":"#f87171","Other":"#a78bfa"};
var REM=[["On the day",0],["1 day before",1],["3 days before",3],["1 week before",7]];
var PAGES={dashboard:"Dashboard",calendar:"Calendar and events",money:"Transactions",budget:"Monthly budget",goals:"Goals",settings:"Settings and PIN"};
function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function pad(n){return String(n).padStart(2,"0")}
function ymd(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}

function wstart(d){return addD(d,-((d.getDay()+6)%7))}
function fdate(s,o){return pd(s).toLocaleDateString("en-GB",o)}

/* ---------- state ---------- */
var S={tx:[],goals:[],budgets:{},habits:[],habitLog:{},focus:[],events:[],reminded:{},usage:{},set:{theme:"",autoLock:5}};
try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);if(p&&typeof p==="object"){for(var k in S)if(p[k]!==undefined)S[k]=p[k];S.set=Object.assign({theme:"",autoLock:5},S.set)}}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function applyTheme(){var r=document.documentElement;if(S.set.theme)r.setAttribute("data-theme",S.set.theme);else r.removeAttribute("data-theme");
  var dark=isDark();$("#themeIcon").innerHTML=dark?'<circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M5 5l1.8 1.8M17.2 17.2L19 19M5 19l1.8-1.8M17.2 6.8L19 5"/>':'<path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/>'}
function isDark(){return S.set.theme?S.set.theme==="dark":!matchMedia("(prefers-color-scheme: light)").matches}

/* ---------- money ---------- */
function ugx(v){return(v<0?"-":"")+"UGX "+Math.abs(Math.round(v)).toLocaleString("en-US")}
function compact(v){var a=Math.abs(v),s;if(a>=1e9)s=(a/1e9).toFixed(1)+"B";else if(a>=1e6)s=(a/1e6).toFixed(1)+"M";else if(a>=1e4)s=Math.round(a/1e3)+"K";else s=a.toLocaleString("en-US");return(v<0?"-":"")+s}
function sh(v){return"UGX "+compact(v)}
function parseMoney(raw){var s=String(raw).trim().toLowerCase().replace(/[,\s]/g,"").replace("ugx",""),m=1;if(!s)return NaN;if(/k$/.test(s)){m=1e3;s=s.slice(0,-1)}else if(/m$/.test(s)){m=1e6;s=s.slice(0,-1)}var n=Number(s);return isFinite(n)?Math.round(n*m):NaN}
function sum(type,m){var t=0;S.tx.forEach(function(x){if(x.type===type&&(!m||mk(x.date)===m))t+=x.amount});return t}
function balance(){return sum("INCOME")-sum("EXPENSE")-sum("SAVING")}
function spentCat(c,m){var t=0;S.tx.forEach(function(x){if(x.type==="EXPENSE"&&x.category.toLowerCase()===c.toLowerCase()&&mk(x.date)===m)t+=x.amount});return t}
function byCat(m){var o={};S.tx.forEach(function(x){if(x.type==="EXPENSE"&&mk(x.date)===m)o[x.category]=(o[x.category]||0)+x.amount});return Object.keys(o).map(function(k){return[k,o[k]]}).sort(function(a,b){return b[1]-a[1]})}
function sorted(){return S.tx.slice().sort(function(a,b){return b.date.localeCompare(a.date)||b.id.localeCompare(a.id)})}
function tcol(t){return t.type==="INCOME"?"var(--good)":t.type==="SAVING"?"var(--amber)":"var(--bad)"}
function tsign(t){return(t.type==="INCOME"?"+":"−")+" "+ugx(t.amount)}
function bcol(r){return r>1?"var(--bad)":r>=.8?"var(--amber)":"var(--acc)"}

/* ---------- logo (same shapes as the desktop app) ---------- */
var lid=0;
function logo(px){var id="lg"+(++lid);return'<svg width="'+px+'" height="'+px+'" viewBox="0 0 100 100" role="img" aria-label="Tumux logo"><defs><linearGradient id="'+id+'" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b794ff"/><stop offset="1" stop-color="#5b21b6"/></linearGradient></defs><rect width="100" height="100" rx="28" fill="url(#'+id+')"/><rect x="22" y="24" width="56" height="15" rx="7" fill="#fff"/><rect x="42.5" y="24" width="15" height="54" rx="7" fill="#fff"/><polyline points="62,78 70,66 76,56" fill="none" stroke="#fbbf24" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M82 50L69 55L80 63z" fill="#fbbf24"/></svg>'}

/* ---------- events ---------- */
function occs(from,to){var out=[];S.events.forEach(function(e){var b=pd(e.date);
  if(!e.yearly){if(b>=from&&b<=to)out.push({e:e,date:b});return}
  for(var y=from.getFullYear();y<=to.getFullYear();y++){var d=new Date(y,b.getMonth(),b.getDate());if(d.getMonth()!==b.getMonth())d=new Date(y,b.getMonth()+1,0);if(d>=b&&d>=from&&d<=to)out.push({e:e,date:d})}});
  return out.sort(function(a,b){return a.date-b.date||a.e.title.localeCompare(b.e.title)})}

/* ---------- habits ---------- */
function done(h,d){return!!S.habitLog[h.id+"|"+d]}
function streak(h){var d=new Date();d=new Date(d.getFullYear(),d.getMonth(),d.getDate());if(!done(h,ymd(d)))d=addD(d,-1);var n=0;while(done(h,ymd(d))){n++;d=addD(d,-1)}return n}

/* ---------- ui state ---------- */
var page="dashboard",sel=today(),calM=new Date(new Date().getFullYear(),new Date().getMonth(),1),monthF="all",entryType="INCOME",locked=false,cb=null;
var F={mode:"FOCUS",remaining:1500,running:false,last:0},FM={FOCUS:["Focus","Focus",25],SHORT:["Short","Short Break",5],LONG:["Long","Long Break",15]};
var T={session:0,paused:false,stopped:false,lastSave:0};
var WX=null,wxState="loading";try{var wc=localStorage.getItem("tumux.wx");if(wc){WX=JSON.parse(wc);wxState="ok"}}catch(e){}

function toast(m){var h=$("#toastHost");h.innerHTML='<div class="toast" role="status">'+esc(m)+'</div>';clearTimeout(toast.t);toast.t=setTimeout(function(){h.innerHTML=""},2600)}

function insights(){var o=[];if(!S.tx.length){return["Welcome to Tumux! You start at UGX 0. Add your first income to begin.","Log what you earn and spend each day and the charts fill in automatically.","Create a goal on the Goals page and move money into it as you save."]}
  var m=mk(today()),inc=sum("INCOME",m),exp=sum("EXPENSE",m),sv=sum("SAVING",m),day=new Date().getDate(),dim=new Date(new Date().getFullYear(),new Date().getMonth()+1,0).getDate();

  var l=sorted().filter(function(t){return monthF==="all"||mk(t.date)===monthF}),i=0,o=0,v=0;l.forEach(function(t){if(t.type==="INCOME")i+=t.amount;else if(t.type==="EXPENSE")o+=t.amount;else v+=t.amount});

function pBudget(){var m=mk(today()),k=Object.keys(S.budgets),lim=0,sp=0;k.forEach(function(c){lim+=S.budgets[c];sp+=spentCat(c,m)});
  var head='<div class="row" style="margin-bottom:12px"><p class="sub" style="font-size:13px">'+new Date().toLocaleDateString("en-GB",{month:"long",year:"numeric"})+' · limits start fresh on the 1st</p><button class="pill s" data-act="budgetnew">+ Set Budget</button></div>';
  if(!k.length)return head+'<div class="card empty">No budgets yet. Press + Set Budget, pick a category such as Food or Transport and enter the most you want to spend on it each month.</div>';
  var r=lim?sp/lim:0,cards=k.map(function(c){var l=S.budgets[c],s=spentCat(c,m),q=l?s/l:0;return'<div class="card"><div class="row"><b>'+esc(c)+'</b><div style="display:flex;gap:6px"><button class="pill s o" data-act="budgetedit" data-c="'+esc(c)+'">Edit</button><button class="x" data-act="budgetdel" data-c="'+esc(c)+'" aria-label="Remove budget">×</button></div></div><div class="bar"><i style="width:'+Math.min(100,q*100)+'%;background:'+bcol(q)+'"></i></div><div class="row" style="font-size:13px"><span class="sub num">'+ugx(s)+" of "+ugx(l)+" · "+Math.round(q*100)+'%</span><b class="'+(s>l?"bad":"good")+' num">'+(s>l?"Over by "+ugx(s-l):ugx(l-s)+" left")+'</b></div></div>'}).join("");
  var loose=byCat(m).filter(function(x){return!Object.keys(S.budgets).some(function(c){return c.toLowerCase()===x[0].toLowerCase()})}).map(function(x){return esc(x[0])+" ("+sh(x[1])+")"});
  return head+'<div class="grid"><div class="card wide"><div class="stats" style="margin:0"><div><small>Budgeted</small><b class="num">'+ugx(lim)+'</b></div><div><small>Spent</small><b class="bad num">'+ugx(sp)+'</b></div><div><small>'+(sp>lim?"Over by":"Left to spend")+'</small><b class="'+(sp>lim?"bad":"good")+' num">'+ugx(Math.abs(lim-sp))+'</b></div></div><div class="bar"><i style="width:'+Math.min(100,r*100)+'%;background:'+bcol(r)+'"></i></div></div>'+cards+(loose.length?'<div class="card wide sub" style="font-size:13px"><b style="color:var(--fg)">No budget yet for:</b> '+loose.join(", ")+'</div>':"")+'</div>'}
function pGoals(){var cards=S.goals.map(function(g){var p=g.target?Math.min(1,g.saved/g.target):0,dn=g.saved>=g.target,ex;if(dn)ex="Goal reached!";else{var left=g.target-g.saved;ex=ugx(left)+" to go";if(g.deadline){var d=Math.round((pd(g.deadline)-pd(today()))/864e5);ex+=d>0?" · "+d+" days left (save about "+ugx(Math.ceil(left/d))+" a day)":" · deadline passed"}}
  return'<div class="card"><div class="row"><b style="font-size:18px">'+esc(g.name)+'</b></div><div class="bar"><i style="width:'+p*100+'%;background:'+(dn?"var(--good)":"")+'"></i></div><div class="num '+(dn?"good":"acc")+'" style="font-weight:700;font-size:14px">'+ugx(g.saved)+" of "+ugx(g.target)+" · "+Math.round(p*100)+'%</div><div class="sub" style="font-size:13px;margin:2px 0 12px">'+ex+'</div><div class="btns" style="margin:0"><button class="pill s" data-act="contrib" data-id="'+g.id+'">Add Money</button><button class="pill s d" data-act="goaldel" data-id="'+g.id+'">Delete</button></div></div>'}).join("");
  return'<div class="row" style="margin-bottom:12px"><p class="sub" style="font-size:13px">Available balance: <b style="color:var(--fg)" class="num">'+ugx(balance())+'</b></p><button class="pill s" data-act="goalnew">+ New Goal</button></div><div class="grid">'+(cards||'<div class="card empty">No goals yet. Press + New Goal to set one, for example “New laptop” or “Emergency fund”.</div>')+'</div>'}

  +(hasPin()?'<label for="al">Lock after being idle</label><select id="al">'+[1,5,10,0].map(function(m){return'<option value="'+m+'"'+(+S.set.autoLock===m?" selected":"")+'>'+(m?m+" minute"+(m>1?"s":""):"Never")+'</option>'}).join("")+'</select>':"")+'</div>'
  +'<div class="card"><h2 style="margin-bottom:6px">Reminders</h2><p class="sub" style="font-size:13px;margin-bottom:12px">Event reminders appear when Tumux is open. Allow notifications to also get an alert from your phone.</p>'+(notif==="granted"?'<p class="good" style="font-size:13px">Notifications are on.</p>':notif==="unsupported"?'<p class="sub" style="font-size:13px">Notifications are not available here.</p>':'<button class="pill s" data-act="notif">Turn on notifications</button>')+'</div>'
  +'<div class="card"><h2 style="margin-bottom:6px">Your data</h2><p class="sub" style="font-size:13px;margin-bottom:12px">Everything is saved on this phone only. Export a backup now and then.</p><button class="pill s o" data-act="backup">Export backup</button></div>'

function render(){var y=window.scrollY,same=render.p===page;render.p=page;
  if(locked){$("#app").innerHTML="";return}
  $("#app").innerHTML={dashboard:pDashboard,calendar:pCalendar,money:pMoney,budget:pBudget,goals:pGoals,settings:pSettings}[page]();
  $("#pageTitle").textContent=PAGES[page];$$("#nav button").forEach(function(b){if(b.dataset.go===page)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
  $("#lockBtn").hidden=!hasPin();window.scrollTo(0,same?y:0)}

/* ---------- PIN lock ---------- */
function b64(buf){var s="";new Uint8Array(buf).forEach(function(x){s+=String.fromCharCode(x)});return btoa(s)}
function derive(salt,pin){var enc=new TextEncoder();return Promise.resolve().then(function(){return crypto.subtle.importKey("raw",enc.encode(pin),"PBKDF2",false,["deriveBits"])}).then(function(k){return crypto.subtle.deriveBits({name:"PBKDF2",salt:salt,iterations:100000,hash:"SHA-256"},k,256)}).then(b64)}
function setPin(pin){var salt=crypto.getRandomValues(new Uint8Array(16));return derive(salt,pin).then(function(h){S.set.pinSalt=b64(salt);S.set.pinHash=h;save()})}
function checkPin(pin){var salt=Uint8Array.from(atob(S.set.pinSalt),function(c){return c.charCodeAt(0)});return derive(salt,pin).then(function(h){return h===S.set.pinHash})}
var entered="",tries=0,pause=0;
function lockHtml(msg){return logo(72)+'<h1 style="font-size:26px">Tumux</h1><p class="sub" id="lmsg" style="min-height:22px">'+(msg||"Enter your PIN")+'</p><div class="pdots">'+[0,1,2,3].map(function(i){return'<i class="'+(i<entered.length?"on":"")+'"></i>'}).join("")+'</div><div class="keys">'+[1,2,3,4,5,6,7,8,9].map(function(n){return'<button data-k="'+n+'" '+(pause?"disabled":"")+'>'+n+'</button>'}).join("")+'<span></span><button data-k="0" '+(pause?"disabled":"")+'>0</button><button data-k="del" aria-label="Delete digit" '+(pause?"disabled":"")+'>⌫</button></div>'}
function lockApp(){if(!hasPin()||locked)return;locked=true;entered="";closeSheet();$("#app").innerHTML="";$("#lockHost").innerHTML='<div class="lockscr" id="lockscr" role="dialog" aria-label="Locked">'+lockHtml()+'</div>'}
function unlock(){locked=false;tries=0;entered="";$("#lockHost").innerHTML="";render();checkReminders()}
function lockKey(k){if(pause)return;if(k==="del")entered=entered.slice(0,-1);else if(entered.length<4)entered+=k;
  var s=$("#lockscr");s.innerHTML=lockHtml();
  if(entered.length===4){var p=entered;checkPin(p).then(function(ok){if(ok){unlock();return}entered="";tries++;
    if(tries>=5){pause=30;tries=0;var iv=setInterval(function(){pause--;var m=$("#lmsg");if(pause<=0){clearInterval(iv);pause=0;var s2=$("#lockscr");if(s2)s2.innerHTML=lockHtml()}else if(m)m.textContent="Too many tries. Wait "+pause+" s"},1000);$("#lockscr").innerHTML=lockHtml("Too many tries. Wait 30 s")}
    else $("#lockscr").innerHTML=lockHtml("Wrong PIN. "+(5-tries)+" tries left")})}}

/* ---------- actions ---------- */
function csv(rows){var s="Date,Type,Category,Note,Amount (UGX)\n";rows.forEach(function(t){s+=[t.date,t.type,'"'+t.category.replace(/"/g,"'")+'"','"'+t.note.replace(/"/g,"'")+'"',t.amount].join(",")+"\n"});return s}
function deliver(name,text,type){var inFrame=false;try{inFrame=window.self!==window.top}catch(e){inFrame=true}
  if(inFrame){try{navigator.clipboard.writeText(text).then(function(){toast("Copied to your clipboard")},function(){toast("Download works in the installed app")})}catch(e){toast("Download works in the installed app")}return}
  try{var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:type}));a.download=name;document.body.appendChild(a);a.click();a.remove();toast("Saved "+name)}catch(e){toast("Could not save the file")}}

 evnew:function(){sheet('<h2>New event</h2><form data-form="event" novalidate>'+fld("v-t","Title",'<input id="v-t" maxlength="50" placeholder="e.g. Mum\'s birthday">')+fld("v-d","Date",'<input id="v-d" type="date" value="'+sel+'">')+fld("v-k","Type",'<select id="v-k">'+opts(KINDS)+'</select>')+'<div class="chk"><input id="v-y" type="checkbox"><label for="v-y">Repeats every year</label></div>'+fld("v-r","Remind me",'<select id="v-r">'+REM.map(function(r){return'<option value="'+r[1]+'">'+r[0]+'</option>'}).join("")+'</select>')+'<div class="err" id="ferr"></div><button class="pill" style="width:100%">Add event</button></form>')},
 delev:function(el){var e=S.events.filter(function(x){return x.id===el.dataset.id})[0];if(!e)return;confirmSheet("Delete the event “"+esc(e.title)+"”?",function(){S.events=S.events.filter(function(x){return x.id!==e.id});save();render()})},
 fmode:function(el){F.mode=el.dataset.m;F.running=false;F.remaining=FM[F.mode][2]*60;render()},
 fplay:function(){if(F.running){tickF();F.running=false}else{if(F.remaining<=0)F.remaining=FM[F.mode][2]*60;F.running=true;F.last=Date.now()}render()},
 freset:function(){F.running=false;F.remaining=FM[F.mode][2]*60;render()},
 tpause:function(){if(T.stopped){T.stopped=false;T.paused=false;T.session=0}else T.paused=!T.paused;var b=$("#tpause");if(b)b.textContent=T.stopped?"Start":T.paused?"Resume":"Pause"},
 tstop:function(){T.stopped=true;T.paused=true;T.session=0;save();render()},
 theme:function(el){S.set.theme=el.dataset.v;save();applyTheme();render()},
 pinset:function(){sheet('<h2>'+(hasPin()?"Change PIN":"Set a PIN")+'</h2><form data-form="pin" novalidate>'+fld("p-a","New 4-digit PIN",'<input id="p-a" type="password" inputmode="numeric" maxlength="4" autocomplete="off">')+fld("p-b","Repeat the PIN",'<input id="p-b" type="password" inputmode="numeric" maxlength="4" autocomplete="off">')+'<div class="err" id="ferr"></div><button class="pill" style="width:100%">Save PIN</button></form>')},
 pinclear:function(){confirmSheet("Remove the PIN lock? Anyone who opens Tumux on this phone will see your finances.",function(){delete S.set.pinHash;delete S.set.pinSalt;save();render()},"Remove PIN")},
 notif:function(){try{Notification.requestPermission().then(function(){render()})}catch(e){toast("Notifications are not available here")}}
};
document.addEventListener("click",function(e){
  var k=e.target.closest("[data-k]");if(k&&locked){lockKey(k.dataset.k);return}
  var g=e.target.closest("[data-go]");if(g){page=g.dataset.go;render();return}
  var a=e.target.closest("[data-act]");if(a&&ACT[a.dataset.act]){e.preventDefault();ACT[a.dataset.act](a)}});
document.addEventListener("submit",function(e){var f=e.target.closest("[data-form]");if(!f)return;e.preventDefault();FORMS[f.dataset.form](f)});
document.addEventListener("change",function(e){if(e.target.id==="mf"){monthF=e.target.value;render()}if(e.target.id==="al"){S.set.autoLock=+e.target.value;save()}});
$("#themeBtn").addEventListener("click",function(){S.set.theme=isDark()?"light":"dark";save();applyTheme();render()});
$("#lockBtn").addEventListener("click",lockApp);
$("#topLogo").innerHTML=logo(34);

/* ---------- live updates ---------- */
function tickF(){if(!F.running)return false;var n=Date.now();F.remaining-=(n-F.last)/1000;F.last=n;if(F.remaining<=0){F.remaining=0;F.running=false;return true}return false}
function paintF(){var r=$("#fring");if(!r)return;var C=2*Math.PI*88,fr=Math.max(0,Math.min(1,F.remaining/(FM[F.mode][2]*60)));r.setAttribute("stroke-dashoffset",C*(1-fr));$("#ftime").textContent=fTime()}
function focusDone(){beep();notify("Tumux","Focus timer finished.");if(F.mode==="FOCUS"){S.focus.push({date:today(),minutes:FM.FOCUS[2]});var n=S.focus.filter(function(x){return x.date===today()}).length;F.mode=n%4===0?"LONG":"SHORT"}else F.mode="FOCUS";F.remaining=FM[F.mode][2]*60;save();if(!locked)render();toast("Time is up. Next: "+FM[F.mode][1])}
setInterval(function(){if(F.running&&tickF())focusDone();paintF()},250);
setInterval(function(){var d=new Date(),t=$("#clkT");if(t){t.textContent=d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit",second:"2-digit"});$("#clkD").textContent=d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",year:"numeric"})}
  if(!locked&&!document.hidden&&!T.paused&&!T.stopped){T.session++;S.usage[today()]=(S.usage[today()]||0)+1;if(++T.lastSave>=15){T.lastSave=0;save()}
    var a=$("#tses");if(a){a.textContent=fdur(T.session);$("#ttod").textContent=fdur(S.usage[today()]);$("#twk").textContent=fdur(usageOf(ymd(wstart(new Date())),today()))}}
  if(S.set.autoLock>0&&hasPin()&&!locked&&Date.now()-idle>S.set.autoLock*6e4)lockApp()},1000);
var idle=Date.now();["pointerdown","keydown","touchstart"].forEach(function(n){document.addEventListener(n,function(){idle=Date.now()},{passive:true})});
document.addEventListener("visibilitychange",function(){if(document.hidden){save();lockApp()}else{idle=Date.now();checkReminders()}});

/* ---------- reminders ---------- */
function checkReminders(){var t=pd(today()),lines=[],keys=[];
  occs(t,addD(t,7)).forEach(function(o){var d=Math.round((o.date-t)/864e5);if(d>o.e.remind)return;var key=o.e.id+"|"+ymd(o.date)+"|"+(d===0?"day":"early");if(S.reminded[key])return;keys.push(key);
    lines.push((d===0?"Today: ":d===1?"Tomorrow: ":"In "+d+" days: ")+o.e.title+" ("+o.e.kind+")")});
  if(!keys.length)return;
  if(locked){notify("Tumux","You have "+keys.length+" reminder"+(keys.length>1?"s":"")+". Unlock Tumux to see them.");return}
  keys.forEach(function(k){S.reminded[k]=1});save();notify("Tumux reminder",lines[0]);beep();
  sheet('<h2>Reminders</h2><div class="list">'+lines.map(function(l){return'<div class="li"><span class="dot" style="background:var(--pink)"></span><div class="m"><b style="white-space:normal">'+esc(l)+'</b></div></div>'}).join("")+'</div><div class="btns" style="margin:16px 0 0"><button class="pill" data-act="close">Got it</button></div>')}
setInterval(checkReminders,60000);

/* ---------- start ---------- */
applyTheme();
if(hasPin())lockApp();else render();
fetchWx();setInterval(fetchWx,30*60*1000);
if(!locked)setTimeout(checkReminders,800);
})();
</script>
